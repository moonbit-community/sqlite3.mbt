name: bleeding check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: wasm (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: install MoonBit
        uses: moonbit-community/setup-moonbit@04293a8a813bfd4b6c2fce22701b52ae1050d100
        with:
          version: bleeding

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: moon version
        run: moon version --all

      - name: moon update
        run: moon update

      - name: install latest moonrun
        shell: bash
        run: |
          moonrun_root="$PWD/.moonrun"
          cargo install --git https://github.com/moonbitlang/moon --branch main --locked --root "$moonrun_root" --bin moonrun moonrun
          moonrun_path="$moonrun_root/bin/moonrun"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            moonrun_path="${moonrun_path}.exe"
            echo "MOONRUN_OVERRIDE=$(cygpath -w "$moonrun_path")" >> "$GITHUB_ENV"
          else
            echo "MOONRUN_OVERRIDE=$moonrun_path" >> "$GITHUB_ENV"
          fi
          "$moonrun_path" --version

      - name: moon check
        run: moon check --target wasm

      - name: info check
        run: |
          moon info --target wasm
          git diff --exit-code

      - name: moon test
        env:
          MOONBIT_ASYNC_CHECK_FD_LEAK: 1
        run: moon test --target wasm

      - name: Wasm I/O error contract
        run: python scripts/test-wasm-errors.py
