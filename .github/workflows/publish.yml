name: publish-package
run-name: publish to mooncakes
on: workflow_dispatch

permissions:
  contents: write

concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: moon version
        run: |
          moon version --all
      - name: moon update
        run: |
          moon update
      - name: moon check
        run: |
          moon check --target native --deny-warn
      - name: publish
        run: |
          credentials="$HOME/.moon/credentials.json"
          printf '%s\n' "$SECRET" > "$credentials"
          trap 'rm -f "$credentials"' EXIT
          moon publish
        env:
          SECRET: ${{ secrets.MOONCAKES_MOONBIT_COMMUNITY_TOKEN }}
      - name: tag published commit
        run: |
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' moon.mod)"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
